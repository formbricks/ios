name: SonarQube
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

jobs:
  build-and-analyze:
    runs-on: macos-15

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for better SonarQube analysis
          # This workflow runs on pull_request and then executes project code
          # (swift package resolve, xcodebuild test). Leaving the token in
          # .git/config would put it within reach of that code.
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Install Dependencies
        run: swift package resolve

      - name: Run tests
        run: |
          xcodebuild test \
          -scheme 'FormbricksSDK' \
          -sdk iphonesimulator \
          -config Debug \
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
          -derivedDataPath build \
          -enableCodeCoverage YES

      - name: Extract code coverage and convert to XML
        run: |
          mkdir -p coverage
          bash ./scripts/xccov-to-sonarqube-generic.sh build/Logs/Test/*.xcresult > coverage/coverage.xml

      # Run SonarCloud scan, pointing at the Cobertura report
      - name: SonarCloud Scan
        # Held at v6.0.0 deliberately — do not bump to v8 without re-testing.
        # v8 verifies the scanner binary's GPG signature by fetching SonarSource's
        # public key from a keyserver, and on this macOS runner gpg cannot reach
        # either keyserver (`keyserver receive failed: Invalid argument` from both
        # hkps://keyserver.ubuntu.com and hkps://keys.openpgp.org, in under a second).
        # dirmngr resolves keyservers over SRV records, which harden-runner's DNS
        # proxy does not answer. v6.0.0 already carries the fixes for CVE-2025-58178
        # and CVE-2025-59844, so this pin is current on security.
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=formbricks
            -Dsonar.projectKey=formbricks_ios
            -Dsonar.sources=Sources/FormbricksSDK
            -Dsonar.tests=Tests/FormbricksSDKTests
            -Dsonar.coverageReportPaths=coverage/coverage.xml
            -Dsonar.verbose=true
            -Dsonar.exclusions=**/Mock/**,**/*.xcodeproj/**,**/.swiftpm/**
            -Dsonar.c.file.suffixes=-
            -Dsonar.cpp.file.suffixes=-
            -Dsonar.objc.file.suffixes=-
